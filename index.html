    <title>CSS ID and Class</title>

    <style>
        /* Style the title using ID */
        #title {
            color: blue;
            font-size: 28px;
        }

        /* Style the card using class */
        .card {
            border: 2px solid black;
            padding: 20px;
            width: 300px;
        }
    </style>
</head>
<body>

    <h2 id="title">My CSS Page</h2>

    <div class="card">
        Mustafa Khan
    </div>

</body>
